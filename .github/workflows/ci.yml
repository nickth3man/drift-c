# Required checks for every pull request.
#
# Five jobs, deliberately not ten: quality, the Linux headless build, the real Windows build,
# sanitizers, and coverage. They split further only when runtime or ownership makes that
# necessary.
#
# Actions are pinned to full commit SHAs (the only immutable reference GitHub offers) and
# permissions are read-only unless a job needs more.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run pointless; cancel it rather than paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # raylib is needed for its HEADER only in every job below: the headless build calls no
  # raylib function and links no raylib library.
  RAYLIB_REF: "6.0"

jobs:
  quality:
    name: quality (format, static analysis, workflow lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tools cppcheck shellcheck

      - name: clang-format
        # Advisory until the tree is normalised in its own commit: see the adoption note in
        # .clang-format. Flip continue-on-error to false in the same pull request that lands
        # the normalisation, and this becomes a real gate.
        continue-on-error: true
        run: clang-format --dry-run --Werror src/*.c src/*.h tests/*.c fuzz/*.c

      - name: ShellCheck
        run: shellcheck build.sh scripts/*.sh

      - name: actionlint
        run: |
          # Pinned by version, verified by checksum, and run from a temporary directory: no
          # third-party action is trusted with the workflow token.
          version=1.7.12
          checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${checksum}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Fetch raylib headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raysan5/raylib
          ref: ${{ env.RAYLIB_REF }}
          path: third_party/raylib-src

      - name: cppcheck
        run: make lint

      - name: clang --analyze
        run: make analyze

  linux-tests:
    name: linux headless (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch raylib headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raysan5/raylib
          ref: ${{ env.RAYLIB_REF }}
          path: third_party/raylib-src

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and run every scenario
        run: make test-physics CC=${{ matrix.compiler }}

      - name: Compare telemetry against the committed baselines
        # Informational across toolchains: the committed baselines were recorded on Windows
        # with MSYS2 GCC. physics-regression.yml is the gate, because it compares two builds
        # made by the same compiler on the same runner.
        continue-on-error: true
        run: make regression CC=${{ matrix.compiler }}

      - name: Standalone fuzz corpora
        run: |
          set -e
          for target in fuzz/fuzz_*.c; do
            name=$(basename "$target" .c)
            ${{ matrix.compiler }} -std=c11 -Isrc -Ithird_party/raylib-src/src -O1 -g \
              -DDRIFTY_HEADLESS "$target" src/dev_params.c src/dev_replay.c src/vehicle.c \
              src/tire.c src/replay.c src/math_utils.c src/input.c -o "/tmp/$name" -lm
            "/tmp/$name"
          done

      - name: Upload telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-linux-${{ matrix.compiler }}
          path: |
            telemetry/*.csv
            artifacts/**
          retention-days: 7
          if-no-files-found: ignore

  windows-build:
    name: windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raylib
            make
            git

      - name: Debug build (module + platform)
        run: ./build.sh

      - name: Release build
        run: ./build.sh --release

      - name: Headless tests
        run: ./build.sh --tests && ./drifty_tests.exe

      - name: Hot-reload harness
        run: ./build.sh --hotreload-harness && ./drifty_hotreload_harness.exe

      - name: Linkage inspection
        # The development module must import libraylib.dll; the release and test binaries
        # must not. Getting this backwards breaks hot reload in a way nothing else catches.
        run: |
          objdump -p build/game.dll | grep -i "DLL Name" | grep -qi "libraylib.dll"
          ! objdump -p drifty_release.exe | grep -i "DLL Name" | grep -qi "libraylib.dll"
          ! objdump -p drifty_tests.exe | grep -i "DLL Name" | grep -qi "libraylib.dll"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-failure
          path: |
            artifacts/**
            telemetry/*.csv
          retention-days: 7
          if-no-files-found: ignore

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch raylib headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raysan5/raylib
          ref: ${{ env.RAYLIB_REF }}
          path: third_party/raylib-src

      - name: ASan + UBSan over every scenario
        run: make sanitize

      - name: Upload failure bundles
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizer-failure
          path: artifacts/**
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch raylib headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raysan5/raylib
          ref: ${{ env.RAYLIB_REF }}
          path: third_party/raylib-src

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: pip install gcovr==7.2

      - name: Build with coverage and run every scenario
        run: make coverage

      - name: Summary
        run: |
          {
            echo "## Coverage"
            echo ""
            echo '```'
            gcovr --root . --filter 'src/.*' --exclude 'src/dev_lab.c' --txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/**
          retention-days: 14
          if-no-files-found: warn
