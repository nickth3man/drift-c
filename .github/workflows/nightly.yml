# Nightly: the slow things that must not run on every documentation change.
#
# Long stress runs, every scenario under sanitizers, the replay corpus, and full static
# analysis. Nothing here gates a pull request; it exists to find the failure that only shows
# up after a hundred thousand ticks.
name: nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: long-run stress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch raylib headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raysan5/raylib
          ref: "6.0"
          path: third_party/raylib-src

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Every scenario under ASan and UBSan
        run: make sanitize

      - name: Ten million fixed updates
        run: |
          make tests
          ./build/tests/drifty_tests --benchmark 10000000

      - name: Replay corpus
        # Every replay.bin the repository carries must still load in today's build. A format
        # change that silently orphans old bundles is exactly what this catches.
        run: |
          set -e
          shopt -s nullglob
          files=(tests/replays/*.bin artifacts/**/replay.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no replay corpus committed yet — nothing to check"
            exit 0
          fi
          FUZZ_SUPPORT_SRCS="$(make --no-print-directory -s print-source-group GROUP=FUZZ_SUPPORT_SRCS)"
          clang -std=c11 -Isrc -Ithird_party/raylib-src/src -O1 -g -DDRIFTY_HEADLESS \
            fuzz/fuzz_replay.c $FUZZ_SUPPORT_SRCS -o /tmp/replay_check -lm
          /tmp/replay_check "${files[@]}"

      - name: Telemetry report for every scenario
        run: |
          make test-physics
          python tools/telemetry/make_report.py --dir artifacts/telemetry --title "Drifty — nightly" \
            --out artifacts/nightly-report.html

      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly
          path: |
            artifacts/**
          retention-days: 14
          if-no-files-found: ignore

  analysis:
    name: full static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch raylib headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raysan5/raylib
          ref: "6.0"
          path: third_party/raylib-src

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tools

      - name: cppcheck with every check enabled
        run: |
          cppcheck --quiet --std=c11 --language=c --enable=all --inconclusive \
            --inline-suppr --suppress=missingIncludeSystem --suppress='*:third_party/*' \
            -I src -I third_party/raylib-src/src src tests fuzz

      - name: Clang Static Analyzer
        run: make analyze
