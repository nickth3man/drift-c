# Scheduled fuzzing of the pure, deterministic functions.
#
# Short and scheduled, not continuous: this is a small game, and a nightly quarter of an hour
# across three targets finds the parser and edge-case bugs that matter without any hosted
# fuzzing infrastructure.
#
# The targets assert PROPERTIES, never exact values — no NaN, forces inside the friction
# ellipse, zero slip giving zero force, a rejected file changing nothing. Exact numbers are
# the thing under development; the properties are not.
name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "300"
  pull_request:
    paths:
      - "fuzz/**"
      - "src/dev/dev_params.*"
      - "src/dev/dev_replay.*"
      - "src/physics/tire.*"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_profile, fuzz_replay, fuzz_tire]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch raylib headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raysan5/raylib
          ref: "6.0"
          path: third_party/raylib-src

      - name: Build ${{ matrix.target }}
        run: |
          mkdir -p artifacts/fuzz corpus/${{ matrix.target }}
          # Link membership comes from the Makefile manifest, not a copy in this file.
          FUZZ_SUPPORT_SRCS="$(make --no-print-directory -s print-source-group GROUP=FUZZ_SUPPORT_SRCS)"
          clang -std=c11 -Isrc -Ithird_party/raylib-src/src -O1 -g \
            -DDRIFTY_HEADLESS -DDRIFTY_LIBFUZZER \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            fuzz/${{ matrix.target }}.c $FUZZ_SUPPORT_SRCS \
            -o artifacts/fuzz/${{ matrix.target }} -lm

      - name: Run
        run: |
          seconds="${{ github.event.inputs.seconds || '300' }}"
          # A pull request run is a smoke test, not a campaign.
          if [ "${{ github.event_name }}" = "pull_request" ]; then seconds=45; fi
          artifacts/fuzz/${{ matrix.target }} corpus/${{ matrix.target }} \
            -max_total_time="$seconds" -print_final_stats=1 \
            -artifact_prefix=artifacts/fuzz/

      - name: Upload crashes and corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            artifacts/fuzz/crash-*
            artifacts/fuzz/leak-*
            artifacts/fuzz/timeout-*
            corpus/**
          retention-days: 14
          if-no-files-found: ignore
